<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>記事プレビュー（管理用） — Cignals</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    :root{--bg:#f5f3ef;--paper:#fff;--ink:#221716;--muted:#776b67;--line:#ded6d0;--red:#eb0034;--soft:#ece5df}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter","Noto Sans JP",system-ui,-apple-system,sans-serif;line-height:1.8}
    .wrap{max-width:960px;margin:0 auto;padding:40px 20px 100px}
    header.top{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:20px;border-bottom:2px solid var(--ink);margin-bottom:8px}
    header.top h1{margin:0;font-size:26px;letter-spacing:-.02em}
    header.top .note{color:var(--muted);font-size:13px}
    .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;position:sticky;top:0;background:var(--bg);padding:16px 0;z-index:10;border-bottom:1px solid var(--line);margin-bottom:24px}
    .toolbar .count{margin-right:auto;font-weight:800;font-size:14px}
    .btn{padding:8px 14px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--ink);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
    .btn.active{background:var(--ink);color:#fff;border-color:var(--ink)}
    .article{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:28px;margin-bottom:20px}
    .article-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:6px}
    .badge{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
    .badge.published{background:#e7f6ec;color:#1a7f43}
    .badge.draft{background:#fdeaea;color:var(--red)}
    .date{color:var(--muted);font-size:13px;font-weight:700}
    .article h2{margin:6px 0 4px;font-size:26px;line-height:1.2;letter-spacing:-.03em}
    .slug{color:var(--muted);font-size:12px;font-family:ui-monospace,monospace;margin-bottom:14px;word-break:break-all}
    .excerpt{padding:12px 16px;background:var(--soft);border-radius:12px;color:var(--ink);font-size:15px;margin-bottom:18px}
    .body-text{font-size:15px}
    .body-text p{margin:0 0 16px}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
    .tag{padding:4px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
    .metagrid{margin-top:18px;padding-top:16px;border-top:1px dashed var(--line);display:grid;grid-template-columns:120px 1fr;gap:6px 14px;font-size:13px}
    .metagrid dt{color:var(--muted);font-weight:700}
    .metagrid dd{margin:0;word-break:break-all}
    .wordcount{color:var(--muted);font-size:12px;margin-top:10px}
    .err{padding:20px;border:1px solid var(--red);border-radius:12px;color:var(--red);background:#fff}
    .hint{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:13px;color:var(--muted);margin-bottom:20px}
    @media(max-width:620px){.metagrid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <h1>記事プレビュー</h1>
      <span class="note">管理用ページ（検索エンジン非公開）／data/journal.json を読み込んで表示しています</span>
    </header>
    <div class="hint">
      このページは記事の内容確認用です。公開サイトには表示されません。記事を追加・修正したら <code>data/journal.json</code> を更新して、このページを再読み込みしてください。<code>status</code> が <strong>draft</strong> の記事は公開サイトには出ますが、ここでは色分けして区別できます。
    </div>
    <div class="toolbar">
      <span class="count" id="count">読み込み中…</span>
      <button class="btn active" data-filter="all">すべて</button>
      <button class="btn" data-filter="published">公開のみ</button>
      <button class="btn" data-filter="draft">下書きのみ</button>
    </div>
    <div id="list"></div>
  </div>

  <script>
    const esc = (s='') => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
    let ALL = [];
    let filter = 'all';

    const countWords = (body='') => String(body).replace(/\s/g,'').length;

    const render = () => {
      const list = document.getElementById('list');
      const items = ALL.filter(a => filter === 'all' ? true : (a.status || 'published') === filter);
      document.getElementById('count').textContent = `全 ${ALL.length} 件中 ${items.length} 件を表示`;
      if (!items.length) { list.innerHTML = '<p class="err">該当する記事がありません。</p>'; return; }
      list.innerHTML = items.map(a => {
        const status = a.status || 'published';
        const paras = String(a.body || '').split(/\n\n+/).filter(Boolean).map(p => `<p>${esc(p)}</p>`).join('');
        const tags = (a.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
        const credits = a.credits && Object.keys(a.credits).length
          ? Object.entries(a.credits).map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('') : '';
        return `<article class="article">
          <div class="article-head">
            <span class="badge ${status}">${status === 'draft' ? '下書き' : '公開'}</span>
            <span class="date">${esc(a.publishedAt || a.year || '')}</span>
          </div>
          <h2>${esc(a.title || '（無題）')}</h2>
          <div class="slug">id: ${esc(a.id || '')}　→　公開URL: journal.html#${esc(a.id || '')}</div>
          ${a.excerpt ? `<div class="excerpt">${esc(a.excerpt)}</div>` : ''}
          <div class="body-text">${paras || '<p style="color:#999">本文が空です</p>'}</div>
          <div class="wordcount">本文 約 ${countWords(a.body)} 文字</div>
          ${tags ? `<div class="tags">${tags}</div>` : ''}
          ${credits ? `<dl class="metagrid">${credits}</dl>` : ''}
          <dl class="metagrid">
            <dt>メイン画像</dt><dd>${esc(a.mainImage || '（未設定）')}</dd>
            <dt>タイプ</dt><dd>${esc(a.type || 'journal')}</dd>
          </dl>
        </article>`;
      }).join('');
    };

    document.querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => {
      document.querySelectorAll('.btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      filter = b.dataset.filter;
      render();
    }));

    fetch('data/journal.json')
      .then(r => { if (!r.ok) throw new Error('data/journal.json が見つかりません'); return r.json(); })
      .then(data => {
        ALL = Array.isArray(data) ? data.slice().sort((a,b) => String(b.publishedAt||b.year||'').localeCompare(String(a.publishedAt||a.year||''))) : [];
        render();
      })
      .catch(err => {
        document.getElementById('count').textContent = '';
        document.getElementById('list').innerHTML = `<p class="err">${esc(err.message)}<br><br>このプレビューは data/journal.json を読み込みます。ローカルで開く場合は、簡易サーバー（例: <code>python3 -m http.server</code>）経由で開いてください。file:// で直接開くと、ブラウザの制限で JSON を読み込めないことがあります。</p>`;
      });
  </script>
</body>
</html>
